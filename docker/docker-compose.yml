# Docker's own default logging driver (json-file) has no size cap at all --
# left alone, each container's stdout/stderr grows on disk forever. That's a
# real problem here, not a theoretical one: fb-server runs with `-o CONNECT`
# below, so it logs a line per player connection on top of every INFO/ERROR
# line, and a long-lived public server accumulates that indefinitely with
# nothing to stop it. Capped the same way for all three services via this
# shared anchor: 10MB per file, 3 files kept (the current one plus 2 rotated
# out), so each container's logs top out around 30MB rather than however
# large `docker/*.log` happens to grow on a VM nobody is watching.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Frozen Bubble game server ───────────────────────────────────────────────
  # Accepts both native TCP clients (desktop/Android) on port 1511 and
  # browser WebSocket clients relayed through nginx on port 443.
  fb-server:
    build:
      context: ..          # repo root — Dockerfile copies from server/
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # -n names this server. Without it fb-server falls back to gethostname()
    # truncated to 12 chars, which inside a container is the container ID --
    # so the server advertises itself to the public list, and announces every
    # arrival to Discord, as something like "ce98fdda68c6", and that string
    # changes on every rebuild. Set FB_SERVER_NAME in docker/.env.
    #
    # -n itself caps out at 12 chars, [a-zA-Z0-9.-] only, and fb-server
    # refuses to start at all on a violation -- not a warning, exit(1), which
    # under restart: unless-stopped means a crash loop. Confirmed live: the
    # obvious choice, this server's own domain, was too long and took the
    # game server down until caught. The fallback below is deliberately NOT
    # "frozen-bubble" (13 chars, itself over the limit) for the same reason.
    # Overrides the image's CMD, so every other flag has to be repeated here.
    command: ["/usr/local/bin/fb-server", "-d", "-q", "-l", "-z",
              "-o", "CONNECT", "-n", "${FB_SERVER_NAME:-frozenbubble}"]
    logging: *default-logging
    ports:
      - "1511:1511"        # native TCP clients connect here directly
    environment:
      # Where to fire "a player joined" datagrams for the Discord alert relay.
      # Resolved over the compose-internal network by service name. Comment
      # this out to run with join alerts disabled entirely.
      - FB_SERVER_DISCORD_RELAY=discord-relay:9100
    depends_on:
      - discord-relay

  # ── Discord join-alert relay ────────────────────────────────────────────────
  # Owns the actual Discord webhook POST, which fb-server cannot do itself (no
  # TLS stack, and a single blocking event loop that must not stall mid-game).
  # Runs in stub mode — logging what it would post — until a webhook URL is
  # supplied. See server/discord-relay/README.md.
  discord-relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.discord-relay
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DISCORD_RELAY_BIND=0.0.0.0:9100
      # The one Discord channel join alerts post to; leave unset for stub mode.
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Overrides the server name shown in Discord messages. fb-server's own
      # -n (set via FB_SERVER_NAME above) caps at 12 chars and a restricted
      # charset -- a limit that only constrains what's advertised in-game and
      # on the public server list, nothing on this side of the pipe. Set this
      # to show the real thing (a full domain, say) in Discord without
      # touching -n at all. Leave unset to just show whatever fb-server sent.
      - DISCORD_SERVER_NAME=${DISCORD_SERVER_NAME:-}
      # Optional: threads round-result alerts per room instead of posting
      # each round as a fresh top-level message. Needs a Discord bot (not
      # just the webhook above) since a webhook can only create a new
      # thread on a forum/media channel -- see
      # server/discord-relay/README.md#threading-rounds-per-room and
      # SetupServer.md#round-result-alerts for how to set one up. Leaving
      # either unset (the default) keeps round-result alerts flat via
      # DISCORD_WEBHOOK_URL; join alerts are unaffected either way.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}

  # ── nginx TLS termination + website ─────────────────────────────────────────
  # Terminates SSL and proxies WebSocket connections to fb-server.
  # Browser game clients connect to wss://yourdomain.com:443
  #
  # Also serves the public website on that same port to ordinary browsers --
  # see nginx.conf for how the two are dispatched apart, and Dockerfile.site
  # for where the pages come from. That's why this is a `build:` rather than
  # the plain `image: nginx:alpine` it used to be: the site is generated from
  # the repo's markdown at image build time, not hand-written and mounted.
  #
  # Consequence for deploys: the site only changes when this image is REBUILT,
  # so a content change needs `docker compose up -d --build nginx` -- adding
  # nginx to whatever build command the other services already use. A plain
  # `up -d` will not pick up new page content.
  nginx:
    build:
      context: ..          # repo root — Dockerfile.site reads site/ and docs/
      dockerfile: docker/Dockerfile.site
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"            # redirects to HTTPS
      - "443:443"          # browser WebSocket clients connect here
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/fullchain.pem:/etc/ssl/fb/fullchain.pem:ro
      - ./ssl/privkey.pem:/etc/ssl/fb/privkey.pem:ro
    depends_on:
      - fb-server
