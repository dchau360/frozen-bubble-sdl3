# nginx reverse proxy — terminates TLS and forwards WebSocket to fb-server,
# and serves the public website to ordinary browsers on the same port.
# Browser game clients connect on port 443 (wss://); native clients connect
# directly to fb-server on port 1511 (plain TCP).
#
# One port, two jobs, dispatched on the Upgrade header: a WebSocket handshake
# always carries `Upgrade: websocket`, an ordinary page load never does. Before
# the site existed this location returned 426 to everything that wasn't a
# handshake, so the domain answered a browser with an error page rather than
# anything useful; that branch now serves the generated site instead. Game
# traffic is unaffected either way -- it is the same proxy_pass it always was.

# Private visit log: one file per UTC day under /var/log/visits, which the
# compose file mounts from a gitignored host directory (docker/visits). It is
# never checked in and never served; read it on the server with
# tools/visits.py. The day comes from the request time, so a restart never
# splits or merges days. Only the file name changes -- one format, tab-separated
# so a user agent's spaces and quotes need no escaping.
map $time_iso8601 $visit_day {
    ~^(?<d>\d{4}-\d{2}-\d{2}) $d;
    default                     unknown;
}
log_format visits escape=json '$time_iso8601\t$remote_addr\t$request_method\t$request_uri\t$status\t$http_upgrade\t$http_referer\t$http_user_agent';

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    return 301 https://$host$request_uri;
}

# Only proxy WebSocket upgrade requests to fb-server
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;  # accepts any hostname; nginx uses SNI from the certificate

    ssl_certificate     /etc/ssl/fb/fullchain.pem;
    ssl_certificate_key /etc/ssl/fb/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # The generated site, baked into the image by Dockerfile.site.
    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/visits/$visit_day.log visits;

    location / {
        # These apply only when proxy_pass below actually fires (the
        # try_files branch never uses them), but they cannot live INSIDE the
        # if block: nginx's "if" context only permits a handful of directives
        # (rewrite/return/proxy_pass/break among them) and rejects
        # proxy_http_version/proxy_set_header/proxy_read_timeout with
        # "not allowed here" at config-test time -- caught by
        # verify-site.sh before this ever reached production, not guessed at.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # The player's real address, for fb-server's country lookup (server/
        # ws.c, geoip.c). Set, never appended to: a value the browser sent
        # itself must not survive, or anyone could claim any country.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;

        # WebSocket handshake -> fb-server, exactly as before. `break` stops
        # rewrite-phase processing so the try_files below is not also reached;
        # this is the one `if` form that is safe inside a location (proxy_pass
        # plus break), rather than the nested-location shapes that are not.
        if ($http_upgrade != "") {
            proxy_pass http://fb-server:1511;
            break;
        }

        # Everything else is a browser: serve the site, directory URLs
        # included, so /privacy/ finds privacy/index.html.
        try_files $uri $uri/ =404;
    }
}
