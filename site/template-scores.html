<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="canonical" href="{{CANONICAL}}">
<style>
  /* The world highscores and weekly rankings pages. They wear the game's own High Scores
     screen: the backdrop, logo and wood strip are cut from
     share/gfx/back_hiscores.png, the text is the Droid Sans that screen draws
     in, and the colors are its own (menulist.h: kText, kMuted, kGold,
     kTextShadow; the tab and panel fills from highscoremanager.cpp). The same
     in light and dark mode on purpose, like the game. Like the rest of this
     site, the page makes no request to any other host except the score
     server itself. */
  @font-face {
    font-family: "Droid Sans";
    src: url("{{ROOT}}fonts/DroidSans.ttf") format("truetype");
    font-display: swap;
  }
  /* The menu titles' face (menutheme.cpp), for the weekly page's bar title. */
  @font-face {
    font-family: "Baloo 2";
    src: url("{{ROOT}}fonts/Baloo2-ExtraBold.ttf") format("truetype");
    font-weight: 800;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --text: #f8faef;
    --muted: #aed3ca;
    --gold: #ffda5c;
    --shadow: #140c20;
    --panel: rgba(20, 12, 32, .67);
    --tab: rgba(20, 12, 32, .59);
    --tab-edge: rgba(174, 211, 202, .55);
    --tab-on: rgba(255, 196, 64, .35);
    --tab-on-edge: rgba(255, 218, 92, .94);
    --medal-1: #ffd24a;
    --medal-2: #d6dde8;
    --medal-3: #e39a5a;
  }
  html { background: #2a1606; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #2a1606 url("{{ROOT}}img/scores-back.jpg") center / cover fixed;
    color: var(--text);
    font-family: "Droid Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    text-shadow: 1px 1px 0 var(--shadow);
  }
  .bar {
    height: 45px;
    background: url("{{ROOT}}img/scores-wood.png") repeat-x left top / auto 100%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  .bar a { display: block; height: 100%; width: max-content; text-decoration: none; }
  .bar img { display: block; height: 100%; width: auto; max-width: none; image-rendering: pixelated; }
  .bar-title {
    display: block;
    padding: 0 16px;
    font: 800 1.7rem/45px "Baloo 2", "Droid Sans", sans-serif;
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--shadow);
    white-space: nowrap;
  }
  main { max-width: 820px; margin: 0 auto; padding: 1.2rem 16px 3rem; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
  nav { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; font-size: .85rem; margin-bottom: 1rem; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--gold); }
  nav .home { margin-right: auto; }
  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 10px; }
  .tabs button {
    font: inherit;
    font-size: .88rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    min-width: 9.5rem;
    padding: .3rem .9rem;
    border: 1px solid var(--tab-edge);
    background: var(--tab);
    color: var(--muted);
    text-shadow: inherit;
    cursor: pointer;
  }
  .tabs.big button { min-width: 11rem; padding: .4rem 1rem; font-size: .98rem; }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-pressed="true"] { background: var(--tab-on); border-color: var(--tab-on-edge); color: var(--gold); font-weight: 700; }
  .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 14px; }
  .board { background: var(--panel); padding: .6rem .8rem .8rem; min-width: 0; }
  .board h2 { margin: 0 0 .35rem; font-size: .95rem; color: var(--gold); letter-spacing: .04em; }
  .board ol { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  .board li { display: flex; align-items: baseline; gap: .6rem; padding: .18rem 0; font-size: .92rem; }
  .board .rank { flex: 0 0 1.8rem; }
  .rank.m1, .rank.m2, .rank.m3 { font-weight: 700; }
  .rank.m1 { color: var(--medal-1); }
  .rank.m2 { color: var(--medal-2); }
  .rank.m3 { color: var(--medal-3); }
  .board .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .figs { flex: 0 0 auto; white-space: pre; }
  .badge { flex: 0 0 auto; align-self: center; font-size: .66rem; font-weight: 700; line-height: 1; padding: .18rem .3rem; color: #f5f5fa; text-shadow: none; letter-spacing: .03em; }
  .badge.t0 { background: #3e5c96; }
  .badge.t1 { background: #268070; }
  .board .flag { flex: 0 0 auto; text-shadow: none; }
  .board .empty { color: var(--muted); padding: .2rem 0; }
  .status { text-align: center; color: var(--muted); font-size: .85rem; margin: .9rem 0 0; }
  .note { text-align: center; color: var(--muted); font-size: .78rem; margin: .3rem 0 0; }
  .about { max-width: 62ch; margin: 1.8rem auto 0; background: var(--panel); padding: .9rem 1.1rem; font-size: .9rem; }
  .about p { margin: 0 0 .7rem; }
  .about p:last-child { margin-bottom: 0; }
  .about a { color: var(--gold); }
  .about code { color: var(--gold); font-family: inherit; }
  .about strong { color: var(--gold); font-weight: 700; }
  nav[data-page="scores"] [data-for="scores"],
  nav[data-page="weekly"] [data-for="weekly"] { color: var(--gold); font-weight: 700; }
  .boards.three { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .board .sub { color: var(--muted); font-size: .8rem; margin: -.2rem 0 .35rem; }
  @media (max-width: 520px) {
    .tabs button, .tabs.big button { min-width: 0; flex: 1 1 0; padding: .35rem .4rem; font-size: .82rem; }
    .board li { font-size: .86rem; gap: .45rem; }
  }
</style>
</head>
<body>
<div class="bar"><a href="{{ROOT}}" aria-label="Frozen Bubble: SDL3 home">{{BAR}}</a></div>
<main>
<nav data-page="{{PAGE}}"><a class="home" href="{{ROOT}}">← Frozen Bubble: SDL3</a><a data-for="scores" href="{{ROOT}}scores/">World highscores</a><a data-for="weekly" href="{{ROOT}}weekly/">Weekly rankings</a></nav>
{{CONTENT}}
</main>
</body>
</html>
