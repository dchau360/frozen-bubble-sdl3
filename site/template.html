<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #555;
    --link: #0b57d0;
    --border: #ddd;
    --code-bg: #f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --muted: #a8a8a8;
      --link: #7fb2ff;
      --border: #333;
      --code-bg: #1f2226;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }
  h1 { font-size: 1.7rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.2rem; margin-top: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  p, li { color: var(--fg); }
  .effective-date { color: var(--muted); margin-top: 0; }
  a { color: var(--link); }
  code { background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
