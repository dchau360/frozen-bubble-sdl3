# GitHub Pages config. Serves this docs/ folder as the project's public site,
# which is what the Play Console store listing and privacy-policy fields point
# at -- a rendered page rather than a raw .md served as text/plain.
#
# Jekyll is deliberately left ON: it is what turns the .md files here into
# HTML. Adding a .nojekyll file would serve them as plain text and defeat the
# purpose. Files without YAML front matter (the Google verification token) are
# copied through byte-for-byte.
title: "Frozen Bubble: SDL3"
description: "A C++/SDL3 port of the classic Frozen Bubble 2 — Linux, macOS, Windows, Android, and in the browser."
theme: jekyll-theme-cayman

# The audit trail, manual test checklist, and internal notes are for
# contributors reading the repo, not visitors to the site.
exclude:
  - audit
  - superpowers
  - MANUAL_TEST_CHECKLIST.md
  - store-assets/PLAY_LISTING.md
  - store-assets/README.md
