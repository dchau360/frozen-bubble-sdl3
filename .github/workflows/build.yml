name: Build and Release

# Documentation-only changes skip the five platform builds. GitHub does not
# evaluate paths/paths-ignore for tag pushes — they are ignored on tags — so a
# release tag still builds and deploys even when its commit touches only
# CHANGELOG.md. The filter applies to branch pushes and pull requests alone.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # Linux → AppImage
  # ────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libfuse2 file \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev libdecor-0-dev libasound2-dev libpulse-dev \
            libjack-dev libsndio-dev libdbus-1-dev libudev-dev \
            libpipewire-0.3-dev libibus-1.0-dev \
            zlib1g-dev libpng-dev libogg-dev libvorbis-dev \
            libfreetype-dev libharfbuzz-dev

      - name: Build SDL3 from source
        run: |
          for repo_tag in \
            "SDL release-3.4.4" \
            "SDL_image release-3.4.2" \
            "SDL_mixer release-3.2.0" \
            "SDL_ttf release-3.2.2"; do
            repo="${repo_tag% *}"
            tag="${repo_tag#* }"
            git clone --depth 1 --branch "$tag" \
              "https://github.com/libsdl-org/${repo}.git" /tmp/$repo
            cmake -S /tmp/$repo -B /tmp/$repo/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL_TEST_LIBRARY=OFF \
              -DSDLIMAGE_SAMPLES=OFF \
              -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF \
              -DSDLMIXER_MP3=OFF -DSDLMIXER_FLAC=OFF \
              -DSDLMIXER_OPUS=OFF -DSDLMIXER_GME=OFF \
              -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF \
              -DSDLMIXER_VENDORED=OFF \
              -DSDLTTF_SAMPLES=OFF -DSDLTTF_VENDORED=OFF \
              -DSDLIMAGE_VENDORED=OFF \
              -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JPG=OFF \
              -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF
            cmake --build /tmp/$repo/build --parallel
            sudo cmake --install /tmp/$repo/build
          done
          sudo ldconfig

      - name: Configure & build game
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      # Until now compilation was the entire CI gate: every registered CTest
      # test sat unrun, so each regression test written for an audit finding
      # guarded nothing on any branch but the author's machine. The two
      # sanitizer-only server tests report themselves SKIPPED here (they need an
      # ASan build — see the test-server-sanitizer job) rather than passing
      # vacuously.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install into AppDir
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          mkdir -p AppDir/usr/share/frozen-bubble
          cp -r share/. AppDir/usr/share/frozen-bubble/
          [ -f build/server/fb-server ] && \
            cp build/server/fb-server AppDir/usr/bin/ || true

      - name: Write .desktop and icon
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/frozen-bubble.desktop << 'EOF'
          [Desktop Entry]
          Name=Frozen Bubble
          Comment=Frozen Bubble SDL3 port
          Exec=frozen-bubble-sdl3
          Icon=frozen-bubble
          Type=Application
          Categories=Game;ArcadeGame;
          EOF
          mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps
          cp share/icons/frozen-bubble-icon-64x64.png \
             AppDir/usr/share/icons/hicolor/64x64/apps/frozen-bubble.png

      - name: Build AppImage
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/frozen-bubble.desktop \
            --output appimage
          mv Frozen_Bubble*.AppImage frozen-bubble-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: frozen-bubble-linux-x86_64.AppImage

  # ────────────────────────────────────────────────────────────────
  # Linux sanitizer build — ASan/UBSan
  #
  # Apple's AddressSanitizer has no leak detection, so this is the only place
  # BUG-001/BUG-041/BUG-042-class leak fixes can be proven at all, and the only
  # place the two sanitizer-only server regression tests (server-massleave-test,
  # server-udp-probe-test) run for real instead of reporting SKIPPED. Reuses
  # build-linux's SDL3-from-source step since the client needs it too; nothing
  # here is packaged or uploaded.
  # ────────────────────────────────────────────────────────────────
  test-linux-sanitizer:
    name: Linux (ASan/UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libfuse2 file \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev libdecor-0-dev libasound2-dev libpulse-dev \
            libjack-dev libsndio-dev libdbus-1-dev libudev-dev \
            libpipewire-0.3-dev libibus-1.0-dev \
            zlib1g-dev libpng-dev libogg-dev libvorbis-dev \
            libfreetype-dev libharfbuzz-dev

      - name: Build SDL3 from source
        run: |
          for repo_tag in \
            "SDL release-3.4.4" \
            "SDL_image release-3.4.2" \
            "SDL_mixer release-3.2.0" \
            "SDL_ttf release-3.2.2"; do
            repo="${repo_tag% *}"
            tag="${repo_tag#* }"
            git clone --depth 1 --branch "$tag" \
              "https://github.com/libsdl-org/${repo}.git" /tmp/$repo
            cmake -S /tmp/$repo -B /tmp/$repo/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL_TEST_LIBRARY=OFF \
              -DSDLIMAGE_SAMPLES=OFF \
              -DSDLMIXER_TESTS=OFF -DSDLMIXER_EXAMPLES=OFF \
              -DSDLMIXER_MP3=OFF -DSDLMIXER_FLAC=OFF \
              -DSDLMIXER_OPUS=OFF -DSDLMIXER_GME=OFF \
              -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF \
              -DSDLMIXER_VENDORED=OFF \
              -DSDLTTF_SAMPLES=OFF -DSDLTTF_VENDORED=OFF \
              -DSDLIMAGE_VENDORED=OFF \
              -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JPG=OFF \
              -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF
            cmake --build /tmp/$repo/build --parallel
            sudo cmake --install /tmp/$repo/build
          done
          sudo ldconfig

      # Matches the sanitizer build documented in CLAUDE.md. CMAKE_C/CXX_FLAGS
      # apply only to this project's own translation units, not the prebuilt
      # SDL3 libs above — ASan's malloc interceptor is still process-global, so
      # allocations our code makes (and frees, or fails to) are still caught
      # even though SDL3 itself wasn't compiled with the flag.
      - name: Configure & build (sanitizer)
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=-fsanitize=address,undefined \
            -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          cmake --build build-asan --parallel

      - name: Run tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure

  # ────────────────────────────────────────────────────────────────
  # macOS → DMG
  # ────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine package version
        id: package_version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="2.4.37"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          brew install sdl3 sdl3_image sdl3_ttf ninja dylibbundler create-dmg \
            libogg libvorbis
          # SDL3_mixer may not be in Homebrew yet — try brew first, fall back to source
          brew install sdl3_mixer 2>/dev/null || (
            git clone --depth 1 --branch release-3.2.0 \
              https://github.com/libsdl-org/SDL_mixer.git /tmp/SDL_mixer
            cmake -S /tmp/SDL_mixer -B /tmp/SDL_mixer/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDLMIXER_VENDORED=OFF \
              -DSDLMIXER_MP3=OFF -DSDLMIXER_FLAC=OFF \
              -DSDLMIXER_OPUS=OFF -DSDLMIXER_GME=OFF \
              -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF
            cmake --build /tmp/SDL_mixer/build --parallel
            sudo cmake --install /tmp/SDL_mixer/build
          )

      # Apple Silicon only, and deliberately so. Homebrew ships single-arch
      # bottles, so a universal binary would require building SDL3 and every
      # dependency for both architectures and lipo-ing them. State the target
      # explicitly rather than inheriting whatever the runner happens to be —
      # the artifact name (frozen-bubble-macos-arm64.dmg) has to keep matching
      # what is actually built. GitHub retires x86_64 macOS runners in 2027.
      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

      - name: Verify the binary is the architecture we claim to ship
        run: |
          set -euo pipefail
          archs=$(lipo -archs build/frozen-bubble-sdl3)
          echo "built for: $archs"
          if [ "$archs" != "arm64" ]; then
            echo "::error::expected arm64, got '$archs' — the DMG name would be wrong"
            exit 1
          fi

      - name: Create .app bundle
        run: |
          APP="dist/FrozenBubble.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"

          cp build/frozen-bubble-sdl3 "$APP/MacOS/frozen-bubble-sdl3"
          cp -r share "$APP/Resources/share"

          dylibbundler -od -b \
            -x "$APP/MacOS/frozen-bubble-sdl3" \
            -d "$APP/Frameworks" \
            -p @executable_path/../Frameworks/ \
            -s /usr/local/lib \
            -s /opt/homebrew/lib

          cat > "$APP/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Frozen Bubble</string>
            <key>CFBundleDisplayName</key><string>Frozen Bubble</string>
            <key>CFBundleIdentifier</key><string>org.frozenbubble.sdl3</string>
            <key>CFBundleVersion</key><string>${{ steps.package_version.outputs.value }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.package_version.outputs.value }}</string>
            <key>CFBundleExecutable</key><string>frozen-bubble-sdl3</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

      - name: Ad-hoc sign app bundle
        run: |
          find dist/FrozenBubble.app/Contents/Frameworks -name "*.dylib" \
            -exec codesign --sign - --force {} \;
          codesign --sign - --force --deep dist/FrozenBubble.app

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Frozen Bubble" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "FrozenBubble.app" 140 190 \
            --app-drop-link 400 190 \
            "frozen-bubble-macos-arm64.dmg" \
            "dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: frozen-bubble-macos-arm64.dmg

  # ────────────────────────────────────────────────────────────────
  # Windows → NSIS installer (.exe)
  # ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-ntldd

      - name: Determine package version
        id: package_version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="2.4.37"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download SDL3 prebuilt MinGW libs
        run: |
          cd /tmp
          curl -fsSL -O https://github.com/libsdl-org/SDL/releases/download/release-3.4.4/SDL3-devel-3.4.4-mingw.tar.gz
          curl -fsSL -O https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.2/SDL3_image-devel-3.4.2-mingw.tar.gz
          curl -fsSL -O https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.0/SDL3_mixer-devel-3.2.0-mingw.tar.gz
          curl -fsSL -O https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-devel-3.2.2-mingw.tar.gz
          for f in SDL3*.tar.gz; do tar xf "$f"; done
          cp -r SDL3-3.4.4/x86_64-w64-mingw32/*       /mingw64/
          cp -r SDL3_image-3.4.2/x86_64-w64-mingw32/* /mingw64/
          cp -r SDL3_mixer-3.2.0/x86_64-w64-mingw32/* /mingw64/
          cp -r SDL3_ttf-3.2.2/x86_64-w64-mingw32/*   /mingw64/

      - name: Configure & build
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Collect binary + DLLs
        run: |
          set -euo pipefail
          mkdir -p pkg
          cp build/frozen-bubble-sdl3.exe pkg/
          # Genuinely optional: CMakeLists.txt excludes server/ on MinGW, so
          # this file is not expected to exist in the Windows package.
          cp build/server/fb-server.exe pkg/ 2>/dev/null || true
          cp -r share pkg/

          # Resolve the real dependency closure instead of copying a
          # hand-maintained list. The old loop applied `cp ... || true` to 21
          # named DLLs, so a missing load-time requirement (SDL3.dll,
          # libstdc++-6.dll and libwinpthread-1.dll are not optional) still
          # produced a green job, a packaged installer, a release asset and an
          # itch.io push, with the first symptom a loader error on a user's
          # machine. A fixed list could also go stale silently the moment an
          # SDL upgrade introduced a new transitive dependency.
          deps=$(ntldd -R pkg/frozen-bubble-sdl3.exe | awk '/=>/ { print $3 }' \
                 | grep -i 'mingw64' | sort -u)
          if [ -z "$deps" ]; then
            echo "::error::dependency walk produced no results; refusing to ship an unverified package"
            exit 1
          fi
          for dll in $deps; do
            cp -v "$(cygpath -u "$dll")" pkg/
          done

          # Union with the previous hand-maintained list, best-effort. The walk
          # above is authoritative for load-time imports and is what makes a
          # genuinely missing dependency fail the job — but it cannot see DLLs
          # opened at runtime through LoadLibrary, which never appear in a PE
          # import table. Copying these too costs a few hundred KB and keeps the
          # package a superset of what shipped before, so replacing the list
          # cannot regress the installer. Absent files are fine: the SDL3 MinGW
          # release archives link most of these in statically, which is why the
          # walk reports far fewer than this list names.
          for dll in \
            libpng16-16.dll libogg-0.dll libvorbis-0.dll libvorbisfile-3.dll \
            libfreetype-6.dll libbrotlicommon.dll libbrotlidec.dll \
            libharfbuzz-0.dll libgraphite2.dll zlib1.dll \
            libglib-2.0-0.dll libintl-8.dll libiconv-2.dll libpcre2-8-0.dll; do
              [ -f "pkg/$dll" ] && continue
              cp "/mingw64/bin/$dll" pkg/ 2>/dev/null \
                && echo "  (extra, not a load-time import) $dll" \
                || true
          done

          # Explicit backstop for the three the audit named, in case a future
          # walker change silently returns a short list.
          for required in SDL3.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [ ! -f "pkg/$required" ]; then
              echo "::error::$required is missing from the package"
              exit 1
            fi
          done
          echo "Packaged $(echo "$deps" | wc -l) dependency DLLs."

      - name: Write NSIS script
        run: |
          cat > installer.nsi << 'EOF'
          Unicode True
          !define APPNAME "Frozen Bubble"
          !define EXENAME "frozen-bubble-sdl3.exe"
          !define VERSION "${{ steps.package_version.outputs.value }}"

          Name "${APPNAME}"
          OutFile "frozen-bubble-windows-setup.exe"
          VIProductVersion "${VERSION}.0"
          VIAddVersionKey "ProductName" "${APPNAME}"
          VIAddVersionKey "ProductVersion" "${VERSION}"
          InstallDir "$PROGRAMFILES64\FrozenBubble"
          InstallDirRegKey HKCU "Software\FrozenBubble" ""
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma

          Page directory
          Page instfiles
          UninstPage instfiles

          Section "Install"
            SetOutPath "$INSTDIR"
            File /r "pkg\*.*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortcut "$DESKTOP\${APPNAME}.lnk" "$INSTDIR\${EXENAME}"
            CreateDirectory "$SMPROGRAMS\${APPNAME}"
            CreateShortcut "$SMPROGRAMS\${APPNAME}\${APPNAME}.lnk" \
              "$INSTDIR\${EXENAME}"
            CreateShortcut "$SMPROGRAMS\${APPNAME}\Uninstall.lnk" \
              "$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "Software\FrozenBubble" "" "$INSTDIR"
          SectionEnd

          Section "Uninstall"
            RMDir /r "$INSTDIR"
            Delete "$DESKTOP\${APPNAME}.lnk"
            RMDir /r "$SMPROGRAMS\${APPNAME}"
            DeleteRegKey HKCU "Software\FrozenBubble"
          SectionEnd
          EOF

      - name: Install NSIS
        shell: cmd
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: frozen-bubble-windows-setup.exe

  # ────────────────────────────────────────────────────────────────
  # Android TV → APK
  # ────────────────────────────────────────────────────────────────
  build-android:
    name: Android TV (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ANDROID_SDK_ROOT is set in the runner's environment, but the `env`
      # expression context is populated only from workflow/job/step `env:`
      # maps, so `${{ env.ANDROID_SDK_ROOT }}` interpolated to the empty string
      # and the cache path became the absolute `/ndk/25.2.9519653`. The cache
      # never hit and every Android run re-downloaded the NDK. Resolve the path
      # in a shell, where the variable really is defined.
      - name: Resolve NDK path
        id: ndk
        run: echo "path=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.ndk.outputs.path }}
          key: ndk-25.2.9519653

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/cache
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install NDK 25 + platform 36
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" "platforms;android-36" "build-tools;36.0.0"

      - name: Init SDL3 submodules
        run: |
          git submodule update --init --depth 1 android/app/jni/SDL3
          git submodule update --init --depth 1 android/app/jni/SDL3_image
          git submodule update --init --depth 1 android/app/jni/SDL3_ttf
          git submodule update --init --depth 1 --recursive android/app/jni/SDL3_mixer

      - name: Init SDL3_image and SDL3_ttf nested submodules
        run: |
          git submodule update --init --depth 1 --recursive android/app/jni/SDL3_image
          git submodule update --init --depth 1 --recursive android/app/jni/SDL3_ttf

      # Guards the transactional asset deployment: these are plain JVM unit
      # tests, so they run without the NDK and fail before the long release
      # build rather than after it.
      - name: Test Android asset deployment
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Generate app icons from source PNG
        run: |
          sudo apt-get install -y imagemagick
          SRC="share/icons/frozen-bubble-icon-64x64.png"
          RES="android/app/src/main/res"
          for size_dir in "48:mipmap-mdpi" "72:mipmap-hdpi" "96:mipmap-xhdpi" "144:mipmap-xxhdpi" "192:mipmap-xxxhdpi"; do
            size="${size_dir%%:*}"
            dir="${size_dir##*:}"
            mkdir -p "$RES/$dir"
            convert "$SRC" -resize "${size}x${size}" "$RES/$dir/ic_launcher.png"
          done
          mkdir -p "$RES/drawable"
          convert "$SRC" -resize 160x160 -background "#1A237E" \
            -gravity center -extent 320x180 "$RES/drawable/tv_banner.png"

      # Android identifies an app by its signing certificate. A keystore
      # generated here would differ on every run, so each release would be
      # signed by a different identity and Android would refuse to install it
      # over the previous one. The key must outlive the workflow, so it comes
      # from repository secrets. See docs/ANDROID_SIGNING.md to create one.
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building an unsigned APK."
          else
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a usable keystore."
              exit 1
            fi
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail rather than publish an installable-but-unupgradable artifact.
      - name: Require a persistent signing key for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && steps.keystore.outputs.present != 'true'
        run: |
          echo "::error::A tagged release needs the ANDROID_KEYSTORE_BASE64, \
          ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD \
          secrets. Without a stable key this APK cannot upgrade an installed one. \
          See docs/ANDROID_SIGNING.md."
          exit 1

      - name: Build release APK
        working-directory: android
        env:
          SIGNED: ${{ steps.keystore.outputs.present }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Rename APK
        run: |
          out=android/app/build/outputs/apk/release
          # Gradle names the artifact differently depending on whether a
          # signing config was injected.
          if [ -f "$out/app-release.apk" ]; then
            mv "$out/app-release.apk" frozen-bubble-android-tv.apk
          elif [ -f "$out/app-release-unsigned.apk" ]; then
            mv "$out/app-release-unsigned.apk" frozen-bubble-android-tv.apk
          else
            echo "::error::No release APK found in $out"
            ls -la "$out" || true
            exit 1
          fi

      # The APK that ships must carry every asset the game loads at runtime, so
      # compare what was packaged against share/ by hash rather than trusting
      # the build to have copied it.
      - name: Verify packaged Android assets
        run: |
          python3 tools/verify_android_assets.py \
            --apk frozen-bubble-android-tv.apk --source share

      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: frozen-bubble-android-tv.apk

  # ────────────────────────────────────────────────────────────────
  # WebAssembly (WASM) — SDL3 via Emscripten ports
  # SDL3_image/SDL3_mixer ports are from pending PRs; this job
  # patches the local emsdk with those port files before building.
  # ────────────────────────────────────────────────────────────────
  build-wasm:
    name: WebAssembly (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pure state-machine tests for the IDBFS hydrate/flush controller. They
      # need no browser and no build, so they run first and fail fast.
      - name: Test WASM persistence state machine
        run: node --test tests/wasm_persistence_test.cjs

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install SDL3_image and SDL3_mixer port files
        run: |
          EMSDK_PORTS="$(dirname $(which emcc))/tools/ports"
          EMSDK_SETTINGS_JS="$(dirname $(which emcc))/src/settings.js"
          EMSDK_SETTINGS_PY="$(dirname $(which emcc))/tools/settings.py"

          # Use port files bundled in the repo (from pending PRs #26571 and #24634)
          cp tools/ports/sdl3_mixer.py "$EMSDK_PORTS/sdl3_mixer.py"
          cp tools/ports/sdl3_image.py "$EMSDK_PORTS/sdl3_image.py"

          # Add SDL3_IMAGE_FORMATS and SDL3_MIXER_FORMATS to settings.js
          if ! grep -q 'SDL3_IMAGE_FORMATS' "$EMSDK_SETTINGS_JS"; then
            sed -i '/SDL2_MIXER_FORMATS/a\
          var SDL3_IMAGE_FORMATS = [];\
          var SDL3_MIXER_FORMATS = [];' "$EMSDK_SETTINGS_JS"
          fi

          # Add to PORTS_SETTINGS in settings.py
          if ! grep -q 'SDL3_MIXER_FORMATS' "$EMSDK_SETTINGS_PY"; then
            sed -i "s/'SDL2_MIXER_FORMATS'/'SDL2_MIXER_FORMATS', 'SDL3_IMAGE_FORMATS', 'SDL3_MIXER_FORMATS'/" "$EMSDK_SETTINGS_PY"
          fi

          # Suppress SDL3 experimental warning that breaks -Werror
          sed -i "s/diagnostics.warning('experimental'/# diagnostics.warning('experimental'/" "$EMSDK_PORTS/sdl3.py"

      - name: Configure & build
        run: |
          mkdir -p build-wasm && cd build-wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make -j$(nproc)

      - name: Package WASM output
        run: |
          mkdir -p dist-wasm
          cp build-wasm/frozen-bubble-sdl3.html dist-wasm/index.html
          cp build-wasm/frozen-bubble-sdl3.js dist-wasm/
          cp build-wasm/frozen-bubble-sdl3.wasm dist-wasm/
          cp build-wasm/frozen-bubble-sdl3.data dist-wasm/
          cd dist-wasm && zip -r ../frozen-bubble-wasm.zip .

      # Drives the packaged build in headless Chrome and reloads it, so the
      # artifact that ships is the one proven to keep settings and highscores
      # across a reload -- not just the build tree. The driver finds Chrome
      # itself (CHROME_BIN, then known paths, then PATH).
      - name: Test WASM persistence across reload
        run: node tools/test-wasm-persistence.mjs dist-wasm

      - uses: actions/upload-artifact@v4
        with:
          name: WASM
          path: |
            dist-wasm/
            frozen-bubble-wasm.zip

  # ────────────────────────────────────────────────────────────────
  # Release — only on v*.*.* tag push
  # ────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-linux, test-linux-sanitizer, build-macos, build-windows, build-android, build-wasm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Linux/frozen-bubble-linux-x86_64.AppImage
            macOS/frozen-bubble-macos-arm64.dmg
            Windows/frozen-bubble-windows-setup.exe
            Android/frozen-bubble-android-tv.apk
            WASM/frozen-bubble-wasm.zip

  # ────────────────────────────────────────────────────────────────
  # Itch.io — deploy each platform on tag push
  #
  # butler-publish-itchio-action is pinned to a commit, not @master. Every one
  # of these five jobs passes it secrets.BUTLER_CREDENTIALS, so a force-push or
  # account takeover on that third-party repository's default branch would have
  # run attacker-chosen code in a job holding the itch.io deploy credential
  # (audit finding REL-011). A tag would not fix this — tags are mutable too.
  # 483157eb is what v1.2.0 and master both pointed at when this was pinned, so
  # the pin changed nothing about what runs. To update, review the diff first.
  # ────────────────────────────────────────────────────────────────
  deploy-itchio-linux:
    name: Deploy Linux to Itch.io
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Linux
          path: dist-linux
      - uses: josephbmanley/butler-publish-itchio-action@483157ebeeeb440e2fdc9f162f3fcfc27028c0ef  # v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: ${{ vars.ITCHIO_GAME }}
          ITCH_USER: ${{ vars.ITCHIO_USERNAME }}
          PACKAGE: dist-linux
          VERSION: ${{ github.ref_name }}

  deploy-itchio-macos:
    name: Deploy macOS to Itch.io
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macOS
          path: dist-macos
      - uses: josephbmanley/butler-publish-itchio-action@483157ebeeeb440e2fdc9f162f3fcfc27028c0ef  # v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: osx
          ITCH_GAME: ${{ vars.ITCHIO_GAME }}
          ITCH_USER: ${{ vars.ITCHIO_USERNAME }}
          PACKAGE: dist-macos
          VERSION: ${{ github.ref_name }}

  deploy-itchio-windows:
    name: Deploy Windows to Itch.io
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows
          path: dist-windows
      - uses: josephbmanley/butler-publish-itchio-action@483157ebeeeb440e2fdc9f162f3fcfc27028c0ef  # v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: ${{ vars.ITCHIO_GAME }}
          ITCH_USER: ${{ vars.ITCHIO_USERNAME }}
          PACKAGE: dist-windows
          VERSION: ${{ github.ref_name }}

  deploy-itchio-android:
    name: Deploy Android to Itch.io
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Android
          path: dist-android
      - uses: josephbmanley/butler-publish-itchio-action@483157ebeeeb440e2fdc9f162f3fcfc27028c0ef  # v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_GAME: ${{ vars.ITCHIO_GAME }}
          ITCH_USER: ${{ vars.ITCHIO_USERNAME }}
          PACKAGE: dist-android
          VERSION: ${{ github.ref_name }}

  deploy-itchio-html5:
    name: Deploy WASM to Itch.io
    needs: build-wasm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WASM
          path: artifact-wasm
      - uses: josephbmanley/butler-publish-itchio-action@483157ebeeeb440e2fdc9f162f3fcfc27028c0ef  # v1.2.0
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: ${{ vars.ITCHIO_GAME }}
          ITCH_USER: ${{ vars.ITCHIO_USERNAME }}
          PACKAGE: artifact-wasm/dist-wasm
          VERSION: ${{ github.ref_name }}
