buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Appodeal's SDK and network adapters are published only here.
        maven { url 'https://artifactory.appodeal.com/appodeal' }
    }
}
