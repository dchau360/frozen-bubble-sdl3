plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// AdMob interstitial ad unit for release builds, from the frozenbubble.support
// AdMob account (app ca-app-pub-7184218625492029~6755877278, whose App ID is in
// AndroidManifest.xml). Not a secret -- it ships inside every APK -- so it is
// committed here and CI's release build needs no secret. Debug builds always use
// Google's published always-test unit instead, so no local or CI build can ever
// produce live ad traffic. Empty means no ads at all: AdsManager checks for it
// and never starts the SDK, so a fork with no AdMob account ships a build with
// no ad requests. local.properties' admob.interstitialId, when set, overrides
// the release unit for a local build.
def admobInterstitialRelease = localProps.getProperty('admob.interstitialId',
        'ca-app-pub-7184218625492029/9389328799')
def admobInterstitialTest = 'ca-app-pub-3940256099942544/1033173712'

// Version string, shared by the APK's versionName and by the native build's
// APP_VERSION (see android/app/CMakeLists.txt). Android does not build through
// the root CMakeLists.txt, so without passing it down the Settings panel falls
// back to platform.h's "v0.0.0-nocmake" placeholder. This is already one of the
// files the release checklist bumps, so it is not a new place to remember.
def appVersionName = "2.4.163"

android {
    namespace 'org.frozenbubble'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "org.frozenbubble"
        // 24 (Android 7.0): set for Appodeal SDK 4.x, which this no longer
        // uses; Google's own SDKs (billing 9.x, androidx.fragment 1.9.0, Mobile
        // Ads 25.x) need 23, and SDL3 21. Kept at 24 so the two-week AdMob-only
        // test changes nothing else about who can install the app.
        minSdk 24
        targetSdk 36
        ndkVersion "25.2.9519653"
        versionCode 146
        versionName appVersionName


        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // c++_static, not c++_shared: with c++_shared, NDK r25 (pinned
                // above) packages its own prebuilt libc++_shared.so verbatim --
                // we never compile it, so the CMakeLists.txt linker flag for
                // 16 KB page alignment can't reach it, and Play now rejects any
                // upload containing an unaligned .so. Static linking bakes libc++
                // into each of our own .so's instead, which the aligned build
                // already covers. Safe here specifically because every boundary
                // between our shared libraries (main <-> SDL3/SDL3_image/
                // SDL3_mixer/SDL3_ttf) is SDL3's plain C API, not C++ objects or
                // exceptions crossing library edges -- which is the actual case
                // NDK's own docs warn a static runtime is unsafe for.
                arguments "-DANDROID_STL=c++_static",
                          "-DAPP_VERSION_NAME=${appVersionName}"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../share']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${admobInterstitialRelease}\""
        }
        debug {
            debuggable true
            jniDebuggable true
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${admobInterstitialTest}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // libvorbisenc.so has no DT_NEEDED or dlopen reference anywhere, so it is
    // dead weight in the APK (IMP-014). The libpng.so exclusion that used to
    // sit here is gone: SDLIMAGE_PNG_LIBPNG is off in CMakeLists.txt, so no
    // libpng is built at all.
    packagingOptions {
        jniLibs {
            excludes += ['**/libvorbisenc.so']
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Google AdMob, directly, with Google's consent SDK (UMP) for the GDPR and
    // US state privacy forms set up in AdMob's Privacy & messaging. Replaced
    // Appodeal's mediation (core 4.4.0 and eight network adapters, PR #230)
    // for a two-week test after Appodeal's SDK failed its own configuration
    // on every start and never started AdMob. 25.5.0 is the version the
    // Appodeal AdMob adapter already shipped, tested on the emulator with
    // this app before the switch.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Not a transitive dependency we happen to want newer -- this line is
    // load-bearing. play-services-basement (pulled in by the Play Billing SDK
    // and by Mobile Ads) declares androidx.fragment:fragment:1.1.0 as its
    // own floor, and still does in its current release: a POM's declared
    // version is a minimum, not what ships. Nothing else in the graph asks
    // for anything newer, so with this line removed the whole app resolves
    // back to fragment 1.1.0 -- verified, and exactly what Play Console's
    // SDK Index flagged as outdated. Declaring it directly outranks the
    // transitive request, since Gradle takes the highest version asked for.
    implementation 'androidx.fragment:fragment:1.9.0'
    // Google Play Billing (for "Remove Ads" IAP)
    implementation 'com.android.billingclient:billing:9.1.0'
}
