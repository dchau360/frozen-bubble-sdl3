plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// Appodeal app key, from the app's page in the Appodeal dashboard. Not a
// secret -- it ships inside every APK -- so it is committed here rather than
// kept in local.properties, and CI's release build picks it up with no secret
// to configure. Empty means no ads at all: AdsManager checks for it and never
// initializes the SDK, so a fork that never signs up for Appodeal ships a
// build with no ad requests instead of one that fails them. local.properties'
// appodeal.appKey, when set, overrides it for a local build.
def appodealAppKeyDefault = '6f4d95943e00283a2adff5eab27c0f1799413b0d792a9ed3'
def appodealAppKey = localProps.getProperty('appodeal.appKey', appodealAppKeyDefault)

// Version string, shared by the APK's versionName and by the native build's
// APP_VERSION (see android/app/CMakeLists.txt). Android does not build through
// the root CMakeLists.txt, so without passing it down the Settings panel falls
// back to platform.h's "v0.0.0-nocmake" placeholder. This is already one of the
// files the release checklist bumps, so it is not a new place to remember.
def appVersionName = "2.4.148"

android {
    namespace 'org.frozenbubble'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "org.frozenbubble"
        // 24 (Android 7.0): Appodeal SDK 4.x's floor. It was 23 before, for
        // Google's own SDKs (billing 9.0.0, androidx.fragment 1.9.0); 21 is
        // SDL3's. The step from 23 costs Android 6.0, well under 1% of
        // active devices.
        minSdk 24
        targetSdk 36
        ndkVersion "25.2.9519653"
        versionCode 131
        versionName appVersionName

        buildConfigField "String", "APPODEAL_APP_KEY", "\"${appodealAppKey}\""

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // c++_static, not c++_shared: with c++_shared, NDK r25 (pinned
                // above) packages its own prebuilt libc++_shared.so verbatim --
                // we never compile it, so the CMakeLists.txt linker flag for
                // 16 KB page alignment can't reach it, and Play now rejects any
                // upload containing an unaligned .so. Static linking bakes libc++
                // into each of our own .so's instead, which the aligned build
                // already covers. Safe here specifically because every boundary
                // between our shared libraries (main <-> SDL3/SDL3_image/
                // SDL3_mixer/SDL3_ttf) is SDL3's plain C API, not C++ objects or
                // exceptions crossing library edges -- which is the actual case
                // NDK's own docs warn a static runtime is unsafe for.
                arguments "-DANDROID_STL=c++_static",
                          "-DAPP_VERSION_NAME=${appVersionName}"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../share']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // libvorbisenc.so has no DT_NEEDED or dlopen reference anywhere, so it is
    // dead weight in the APK (IMP-014). The libpng.so exclusion that used to
    // sit here is gone: SDLIMAGE_PNG_LIBPNG is off in CMakeLists.txt, so no
    // libpng is built at all.
    packagingOptions {
        jniLibs {
            excludes += ['**/libvorbisenc.so']
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Appodeal (ad mediation). Core plus a short list of networks, chosen
    // over the long list Appodeal's demo app pulls in: each adapter adds its
    // own SDK to the APK and its own data collection to the Play Data safety
    // form, and the nested mediation stacks (applovin_max, level_play, bidon)
    // would each bring a second copy of most of these. No AdMob adapter: it
    // needs an AdMob account of our own, and that account is the thing that
    // was not approved. No Meta adapter either: Appodeal can't serve Meta
    // Audience Network through its own accounts, only through an approved
    // Meta account of ours, which there isn't. No analytics adapters (adjust, appsflyer, firebase,
    // facebook_analytics, sentry): this game has no analytics. Versions are
    // the set Appodeal's own demo builds against core 4.4.0.
    implementation 'com.appodeal.ads.sdk:core:4.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:iab:1.8.1.1'
    implementation 'com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0'
    implementation 'com.appodeal.ads.sdk.adapters:applovin:13.6.3.0'
    implementation 'com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:vungle:7.7.4.0'
    implementation 'com.appodeal.ads.sdk.adapters:mintegral:17.1.61.0'
    implementation 'com.appodeal.ads.sdk.adapters:inmobi:11.3.0.0'
    implementation 'com.appodeal.ads.sdk.adapters:dt_exchange:8.4.6.0'
    // Not a transitive dependency we happen to want newer -- this line is
    // load-bearing. play-services-basement (pulled in by the Play Billing SDK,
    // and by several ad networks') declares androidx.fragment:fragment:1.1.0 as its
    // own floor, and still does in its current release: a POM's declared
    // version is a minimum, not what ships. Nothing else in the graph asks
    // for anything newer, so with this line removed the whole app resolves
    // back to fragment 1.1.0 -- verified, and exactly what Play Console's
    // SDK Index flagged as outdated. Declaring it directly outranks the
    // transitive request, since Gradle takes the highest version asked for.
    implementation 'androidx.fragment:fragment:1.9.0'
    // Google Play Billing (for "Remove Ads" IAP)
    implementation 'com.android.billingclient:billing:9.1.0'
}
