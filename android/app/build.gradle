plugins {
    id 'com.android.application'
}

// Firebase Cloud Messaging is optional and switched on purely by the presence
// of google-services.json, which is git-ignored because it identifies a
// specific Firebase project.
//
// Applying the google-services plugin without that file fails the build
// outright, so anyone cloning this repo -- and CI, which has no credentials --
// would be unable to build Android at all if this were unconditional. With the
// file absent the app compiles exactly as it did before push existed, and
// PushManager.getToken() returns "" (it reaches the SDK reflectively for the
// same reason). See docs/PUSH_SETUP.md.
def googleServicesFile = file('google-services.json')
def firebaseEnabled = googleServicesFile.exists()
if (firebaseEnabled) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle("google-services.json found -- Firebase Cloud Messaging enabled")
} else {
    logger.lifecycle("google-services.json absent -- push notifications disabled (see docs/PUSH_SETUP.md)")
}

// Optional AdMob test-device ID(s), read from local.properties (git-ignored,
// same file `sdk.dir` already lives in) rather than hardcoded into source.
// Each one hashes to a specific physical device -- committing them here
// would tie a public GPL repo to a maintainer's real devices for no benefit,
// since nothing else needs it. Google's Mobile Ads SDK logs the exact hash
// to Logcat once an ad is requested from a device not yet on this list; add
// it as `admob.testDeviceId=<hash>` in android/local.properties to always
// get safe test ads on that device even with the real ad unit ID below.
// Comma-separate multiple hashes to whitelist more than one device (see
// AdsManager.configureTestDeviceIfNeeded). Absent -> compiles to an empty
// string, which AdsManager treats as "no test device configured" and serves
// real ads -- the correct default for CI and for a real release build.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def admobTestDeviceId = localProps.getProperty('admob.testDeviceId', '')

// Version string, shared by the APK's versionName and by the native build's
// APP_VERSION (see android/app/CMakeLists.txt). Android does not build through
// the root CMakeLists.txt, so without passing it down the Settings panel falls
// back to platform.h's "v0.0.0-nocmake" placeholder. This is already one of the
// files the release checklist bumps, so it is not a new place to remember.
def appVersionName = "2.4.52"

android {
    namespace 'org.frozenbubble'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "org.frozenbubble"
        minSdk 21
        targetSdk 36
        ndkVersion "25.2.9519653"
        versionCode 35
        versionName appVersionName

        buildConfigField "String", "ADMOB_TEST_DEVICE_ID", "\"${admobTestDeviceId}\""

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // c++_static, not c++_shared: with c++_shared, NDK r25 (pinned
                // above) packages its own prebuilt libc++_shared.so verbatim --
                // we never compile it, so the CMakeLists.txt linker flag for
                // 16 KB page alignment can't reach it, and Play now rejects any
                // upload containing an unaligned .so. Static linking bakes libc++
                // into each of our own .so's instead, which the aligned build
                // already covers. Safe here specifically because every boundary
                // between our shared libraries (main <-> SDL3/SDL3_image/
                // SDL3_mixer/SDL3_ttf) is SDL3's plain C API, not C++ objects or
                // exceptions crossing library edges -- which is the actual case
                // NDK's own docs warn a static runtime is unsafe for.
                arguments "-DANDROID_STL=c++_static",
                          "-DAPP_VERSION_NAME=${appVersionName}"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../share']
            java.srcDirs = ['src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // The real AdMob App ID -- see AndroidManifest.xml. This is what
            // ships to GitHub Releases and any store: real users installing
            // and organically viewing/clicking ads is exactly the traffic
            // AdMob exists for, not a policy risk.
            manifestPlaceholders = [admobAppId: "ca-app-pub-7736855769799322~9200045587"]
        }
        debug {
            debuggable true
            jniDebuggable true
            // Google's own published always-test AdMob App ID (see
            // https://developers.google.com/admob/android/test-ads), paired
            // with AdsManager's debug-only test ad unit ID below. Every
            // debug build -- this developer's own devices, CI, anyone
            // building from source -- gets guaranteed test ads no matter
            // which physical device it lands on, instead of relying on each
            // one being individually whitelisted via admob.testDeviceId
            // first.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // libvorbisenc.so has no DT_NEEDED or dlopen reference anywhere, so it is
    // dead weight in the APK (IMP-014). The libpng.so exclusion that used to
    // sit here is gone: SDLIMAGE_PNG_LIBPNG is off in CMakeLists.txt, so no
    // libpng is built at all.
    packagingOptions {
        jniLibs {
            excludes += ['**/libvorbisenc.so']
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    // Google Play Billing (for "Remove Ads" IAP)
    implementation 'com.android.billingclient:billing:7.1.1'
    // Firebase Cloud Messaging, only when google-services.json is present.
    // PushManager reaches it by reflection, so its absence is a runtime
    // no-op rather than a compile error.
    if (firebaseEnabled) {
        implementation platform('com.google.firebase:firebase-bom:33.1.2')
        implementation 'com.google.firebase:firebase-messaging'
    }
}
